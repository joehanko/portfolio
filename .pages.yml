
media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Engineering Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, year]
      primary: title
    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: category
        label: Engineering Discipline
        type: string

      - name: year
        label: Year
        type: string

      - name: summary
        label: Short Description
        type: text
        required: true

      - name: cover
        label: Cover Photograph
        type: image

      - name: body
        label: Engineering Case Study
        type: rich-text
