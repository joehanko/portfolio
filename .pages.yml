media:
  input: astro-site/public/images/projects
  output: /images/projects

content:
  - name: projects
    label: Engineering Projects
    type: collection
    path: astro-site/src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, year]
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: category
        label: Discipline
        type: string
        required: true
      - name: year
        label: Year
        type: string
        required: true
      - name: summary
        label: Short introduction
        type: text
        required: true
      - name: projectUrl
        label: Live project URL
        type: string
      - name: client
        label: Client
        type: string
      - name: duration
        label: Duration
        type: string
      - name: cover
        label: Hero image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: coverAlt
        label: Hero image description
        type: string
        description: Describe what the image shows for readers who cannot see it.
      - name: coverCaption
        label: Hero image caption
        type: string
      - name: highlights
        label: Highlight cards
        type: object
        list:
          max: 4
          collapsible:
            collapsed: true
            summary: "{value} — {label}"
        fields:
          - name: value
            label: Main detail
            type: string
          - name: label
            label: Explanation
            type: string
      - name: gallery
        label: Project gallery
        type: image
        options:
          multiple:
            max: 8
          unique: true
          extensions: [jpg, jpeg, png, webp]
      - name: featureImage
        label: Full-width image above the project text
        type: image
      - name: quote
        label: Testimonial quote
        type: text
      - name: quoteAttribution
        label: Testimonial attribution
        type: string
      - name: closingImage
        label: Full-width closing image
        type: image
      - name: body
        label: Project write-up
        description: Use heading level 2 to start a text block. Add a heading level 3 directly below it for a bold subheading.
        type: rich-text
